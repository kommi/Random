version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stolencheck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - ml-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stolencheck
      JWT_SECRET: stolencheck-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      ML_SERVICE_URL: http://ml-service:8000
      PORT: "3000"
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE_MB: "10"
      ALERT_COOLDOWN_MINUTES: "30"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
